<template>

	<!-- <progress class="thinkingProgress"
              value.bind="thinkingProgress"
              max="100"></progress> -->

	<div class="controls">

		<div class="controls__column">
			<label class="label" for="removeCandidates">
				<input type="checkbox" 
				name="removeCandidates" 
				id="removeCandidates" 
				checked.bind="removeCandidates" 
				change.delegate="setRemoveCandidates(removeCandidates)">Remove candidates</label>
			<label class="label" for="singleCandidates">
				<input type="checkbox" 
				name="singleCandidates" 
				id="singleCandidates" 
				checked.bind="singleCandidates" 
				change.delegate="setSingleCandidates(singleCandidates)">Find single candidates</label>
			<label class="label" for="uniqueCandidates">
				<input type="checkbox" 
				name="uniqueCandidates" 
				id="uniqueCandidates" 
				checked.bind="uniqueCandidates" 
				change.delegate="setUniqueCandidates()">Find unique candidates</label>
			<label class="label" for="candidateNtuples">
				<input type="checkbox" 
				name="candidateNtuples" 
				id="candidateNtuples" 
				checked.bind="candidateNtuples" 
				change.delegate="setCandidateNtuples()">Find candidate n-tuplets</label>
			<label class="label" for="excludedCandidates">
				<input type="checkbox" 
				name="excludedCandidates" 
				id="excludedCandidates" 
				checked.bind="excludedCandidates" 
				change.delegate="setExcludedCandidates()">Find exluded candidates</label>

		</div>

		<div class="controls__column">
			<button class="button button--green"
				click.delegate="toggleSetupMode()"
				touchstart.delegate="toggleSetupMode()">
				${setupMode ? 'Play' : 'Setup'}</button>
			<button class="button"
				click.delegate="resetGrid()"
				touchstart.delegate="resetGrid()">Clear</button>
			<button class="button"
				click.delegate="solveIt()"
				touchstart.delegate="solveIt()">Solve</button>
			<button class="button"
				click.delegate="saveIt()"
				touchstart.delegate="saveIt()">Save</button>
			<button class="button"
				click.delegate="loadIt()"
				touchstart.delegate="loadIt()">Load</button>
		</div>

	</div>

</template>
